</defs>
<rect width="1080" height="640" fill="#FFFFFF"/>
<text x="24" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">poster-rust 功能设计</text><text x="24" y="66" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">两大模块：人机验证与海报出图</text>
<rect x="48" y="84" width="470" height="470" rx="10" fill="#FFECEC" stroke="#FF6B6B" stroke-width="1.5"/><text x="68" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">验证码 Captcha</text><text x="283" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">四种交互：点击（文字 / 11 种程序化图标）· 旋转 · 滑块（矩形 / 凹凸拼图）· 随机切换</text><rect x="68" y="168" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">一次性</text><text x="86" y="207" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">验证成功或超次即删 key</text><rect x="68" y="230" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="251" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">防暴力</text><text x="86" y="269" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">默认最多 3 次</text><rect x="68" y="292" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="313" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">有效期</text><text x="86" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">默认 300 秒</text><rect x="68" y="354" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="375" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">限流</text><text x="86" y="393" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">跨 key 窗口 30 次 / 60 秒</text><rect x="68" y="416" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="437" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">轨迹校验</text><text x="86" y="455" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">可选：点数 / 耗时 / 线性度</text><rect x="68" y="478" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="499" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">背景</text><text x="86" y="517" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">内置 6 张 / 目录随机 / 程序化三风格</text><rect x="562" y="84" width="470" height="470" rx="10" fill="#E8F3F9" stroke="#45B7D1" stroke-width="1.5"/><text x="582" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">海报生成 Poster</text><text x="797" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">链式 Builder API，14 种元素 + JSON 模板（{{变量}} 替换、导出往返一致）</text><rect x="582" y="168" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">基础</text><text x="600" y="207" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">文字 · 图片 · 头像 · 形状 · 分割线</text><rect x="582" y="230" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="251" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">复合</text><text x="600" y="269" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">二维码 · 表格 · 水印 · 图表（柱/折/饼）· 日历</text><rect x="582" y="292" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="313" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">装饰</text><text x="600" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">艺术字（描边/阴影/渐变/霓虹）· Emoji · 字体图标 · 颜文字</text><rect x="582" y="354" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="375" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">宠物</text><text x="600" y="393" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">Posty 可画进海报，也可作缺图占位</text><rect x="582" y="416" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="437" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">输出</text><text x="600" y="455" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">jpg / png / webp / gif + base64 data URI</text><rect x="582" y="478" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="499" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">模板</text><text x="600" y="517" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">use_template · replace_elements · to_array 往返</text>
