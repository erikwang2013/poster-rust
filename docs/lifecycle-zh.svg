t-anchor="middle" opacity="1.0">TTL 300 秒</text><line x1="520.3333333333334" y1="173" x2="559.6666666666667" y2="173" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="562.6666666666667" y="136" width="200" height="74" rx="9" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="662.6666666666667" y="162" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">校验</text><text x="662.6666666666667" y="181" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">限流 → 原子自增</text><text x="662.6666666666667" y="194" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">≤ 3 次尝试</text><line x1="765.6666666666667" y1="173" x2="805.0000000000001" y2="173" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="808.0" y="136" width="200" height="74" rx="9" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="908.0" y="162" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">终局</text><text x="908.0" y="181" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">通过：删 key（一次性）</text><text x="908.0" y="194" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">超次 / 过期：作废</text><text x="540" y="240" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">容差：点击 18px · 旋转 ±5° · 滑块 ±4px；限流跨 key 生效（默认 30 次 / 60 秒）</text><rect x="48" y="348" width="984" height="240" rx="12" fill="#E8F3F9" stroke="#45B7D1" stroke-width="1.5"/><text x="72" y="378" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">海报生命周期</text><rect x="72.0" y="400" width="200" height="74" rx="9" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="172.0" y="426" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">构建</text><text x="172.0" y="445" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">PosterBuilder（默认 750×1334）</text><text x="172.0" y="458" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">链式 add_* ×14</text><line x1="275.0" y1="437" x2="314.3333333333333" y2="437" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="317.33333333333337" y="400" width="200" height="74" rx="9" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="417.33333333333337" y="426" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">模板（可选）</text><text x="417.33333333333337" y="445" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">JSON + {{变量}} 替换</text><text x="417.33333333333337" y="458" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">replace_elements 控制叠放</text><line x1="520.3333333333334" y1="437" x2="559.6666666666667" y2="437" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="562.6666666666667" y="400" width="200" height="74" rx="9" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="662.6666666666667" y="426" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">渲染</text><text x="662.6666666666667" y="445" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">背景（纯色 / 图片 cover / 渐变）</text><text x="662.6666666666667" y="458" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">逐元素画到同一画布</text><line x1="765.6666666666667" y1="437" x2="805.0000000000001" y2="437" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="808.0" y="400" width="200" height="74" rx="9" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="908.0" y="426" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">输出</text><text x="908.0" y="445" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">save：jpg / png / webp / gif</text><text x="908.0" y="458" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">output：base64 data URI</text><text x="540" y="504" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">宠物 Posty 可画进海报（add_pet）或作为缺图占位（Placeholder::Pet）；模板导出可再次导入，结构一致</text>
