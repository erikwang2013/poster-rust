    <path d="M0,0 L9,4 L0,8 z" fill="#2D3436"/>
  </marker>
</defs>
<rect width="1080" height="640" fill="#FFFFFF"/>
<text x="24" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">poster-rust Feature Design</text><text x="24" y="66" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">Two modules: human verification and poster rendering</text>
<rect x="48" y="84" width="470" height="470" rx="10" fill="#FFECEC" stroke="#FF6B6B" stroke-width="1.5"/><text x="68" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">验证码 Captcha</text><text x="283" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">Four flows: Click (text / 11 procedural icons) · Rotate · Slider (square / jigsaw) · Random</text><rect x="68" y="168" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">One-shot</text><text x="86" y="207" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">key deleted on success or too many attempts</text><rect x="68" y="230" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="251" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Brute-force</text><text x="86" y="269" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">3 attempts by default</text><rect x="68" y="292" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="313" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">TTL</text><text x="86" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">300 seconds by default</text><rect x="68" y="354" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="375" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Rate limit</text><text x="86" y="393" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">cross-key window 30 / 60s</text><rect x="68" y="416" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="437" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Trajectory</text><text x="86" y="455" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">optional: points / duration / linearity</text><rect x="68" y="478" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="86" y="499" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Backgrounds</text><text x="86" y="517" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">6 bundled / directory / 3 procedural styles</text><rect x="562" y="84" width="470" height="470" rx="10" fill="#E8F3F9" stroke="#45B7D1" stroke-width="1.5"/><text x="582" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">海报生成 Poster</text><text x="797" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">Fluent Builder, 14 element types + JSON templates ({{vars}}, lossless round-trip)</text><rect x="582" y="168" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Basic</text><text x="600" y="207" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">Text · Image · Avatar · Shape · Line</text><rect x="582" y="230" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="251" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Composite</text><text x="600" y="269" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">QR · Table · Watermark · Chart (bar/line/pie) · Calendar</text><rect x="582" y="292" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="313" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Decorative</text><text x="600" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">Artistic text (stroke/shadow/gradient/neon) · Emoji · Icon · Emoticon</text><rect x="582" y="354" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="375" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Mascot</text><text x="600" y="393" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">Posty in the poster, or as the missing-image placeholder</text><rect x="582" y="416" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="437" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Output</text><text x="600" y="455" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">jpg / png / webp / gif + base64 data URI</text><rect x="582" y="478" width="430" height="50" rx="8" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="600" y="499" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#2D3436" font-weight="700" text-anchor="start" opacity="1.0">Templates</text><text x="600" y="517" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10.5" fill="#8A6A5B" font-weight="400" text-anchor="start" opacity="1.0">use_template · replace_elements · to_array round-trip</text>
