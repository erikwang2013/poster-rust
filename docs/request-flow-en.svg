tem,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">Guard</text><text x="985" y="148" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">built at wiring (storage probe fails fast) → cloned </text><text x="985" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A5B" font-weight="400" text-anchor="middle" opacity="1.0">per request (two atomic bumps)</text><rect x="60" y="232" width="245" height="250" rx="10" fill="#E7F7F5" stroke="#4ECDC4" stroke-width="1.5"/><text x="182" y="262" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">Generate</text><rect x="76" y="272" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="182" y="290" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">create(kind)</text><rect x="76" y="318" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="182" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">canvas + targets /</text><text x="182" y="348" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">notch / rotation</text><rect x="76" y="364" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="182" y="382" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">PNG persisted to</text><text x="182" y="394" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">Storage (TTL)</text><rect x="76" y="410" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="182" y="428" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">returns CaptchaResult</text><text x="182" y="440" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">JSON</text><line x1="305" y1="357" x2="325" y2="357" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="325" y="232" width="245" height="250" rx="10" fill="#E8F3F9" stroke="#45B7D1" stroke-width="1.5"/><text x="447" y="262" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">Serve image</text><rect x="341" y="272" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="447" y="290" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">GET {path}/{key}</text><rect x="341" y="318" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="447" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">image_bytes(key)</text><rect x="341" y="364" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="447" y="382" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">image/png</text><rect x="341" y="410" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="447" y="428" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">Cache-Control:</text><text x="447" y="440" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">no-store</text><line x1="570" y1="357" x2="590" y2="357" stroke="#8A6A5B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="590" y="232" width="245" height="250" rx="10" fill="#FFECEC" stroke="#FF6B6B" stroke-width="1.5"/><text x="712" y="262" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#2D3436" font-weight="700" text-anchor="middle" opacity="1.0">Verify</text><rect x="606" y="272" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="712" y="290" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="400" text-anchor="middle" opacity="1.0">verify(key, answer)</text><rect x="606" y="318" width="213" height="36" rx="7" fill="#FFFDF8" stroke="#E4EBF0" stroke-width="1.5"/><text x="712" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2D3436" font-weight="