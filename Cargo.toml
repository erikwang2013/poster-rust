[package]
name = "poster-rust"
version = "1.1.2"
edition = "2024"
rust-version = "1.85"
description = "Rust captcha (click/rotate/slider) and poster generation — framework-agnostic core with axum / actix-web / rocket / poem / salvo / warp / bee-rust / e-cat integrations."
license = "MIT"
authors = ["erik <erik@erik.xyz>"]
repository = "https://github.com/erikwang2013/poster-rust"
homepage = "https://erik.xyz"
readme = "README.md"
keywords = ["captcha", "poster", "image", "qr-code", "axum"]
categories = ["multimedia::images", "web-programming"]
exclude = ["docs/i18n", ".claude", ".claude-flow", ".swarm", "ruvector.db"]

[lib]
name = "poster"
path = "src/lib.rs"

[features]
default = []
axum = ["dep:axum", "dep:tokio"]
actix = ["dep:actix-web"]
rocket = ["dep:rocket", "dep:tokio"]
poem = ["dep:poem", "dep:tokio"]
salvo = ["dep:salvo", "dep:tokio"]
warp = ["dep:warp", "dep:tokio"]
bee-rust = ["dep:bee_router", "axum"]
ecat = ["axum"]
redis = ["dep:redis"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rand = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
redis = { version = "0.27", optional = true, default-features = false }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["json", "query", "tokio", "http1"] }
actix-web = { version = "4.15", optional = true, default-features = false }
rocket = { version = "0.5.1", optional = true, default-features = false, features = ["json"] }
poem = { version = "3.1.12", optional = true, default-features = false, features = ["server"] }
salvo = { version = "1.0.1", optional = true, default-features = false }
warp = { version = "0.4.3", optional = true, default-features = false }
bee_router = { version = "1.2.3", optional = true, default-features = false }
# 各框架 handler 里把 CPU / 存储 IO 重活丢进阻塞线程池（`tokio::task::spawn_blocking`）。
# 已在依赖树中（框架本身就跑在 tokio 上），只补 `rt` 这个 feature。
tokio = { version = "1", features = ["rt"], optional = true }

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "perf"
harness = false

[dev-dependencies]
rqrr = "0.8"
axum = { version = "0.8", features = ["tokio", "http1"] }
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
warp = { version = "0.4.3", features = ["test"] }
poem = { version = "3.1.12", default-features = false, features = ["server", "test"] }
# default-features = false：避开默认的 aws-lc-rs（C 库构建），只补 `test` 模块
salvo = { version = "1.0.1", default-features = false, features = ["test"] }

[[example]]
name = "axum_captcha"
required-features = ["axum"]

[[example]]
name = "actix_captcha"
required-features = ["actix"]

[[test]]
name = "integrations_axum"
required-features = ["axum"]

[[test]]
name = "integrations_actix"
required-features = ["actix"]

[[test]]
name = "integrations_warp"
required-features = ["warp"]

[[test]]
name = "integrations_rocket"
required-features = ["rocket"]

[[test]]
name = "integrations_poem"
required-features = ["poem"]

[[test]]
name = "integrations_salvo"
required-features = ["salvo"]

[profile.release]
lto = "thin"
